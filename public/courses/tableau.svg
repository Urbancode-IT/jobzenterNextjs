<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="tableauGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e8622a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c9470e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#tableauGradient)" opacity="0.15"/>
  
  <!-- Tableau puzzle-like logo -->
  <g transform="translate(50, 50)">
    <!-- Top-left square -->
    <rect x="-18" y="-18" width="12" height="12" fill="none" stroke="#e8622a" stroke-width="2" rx="1"/>
    
    <!-- Top-right square -->
    <rect x="6" y="-18" width="12" height="12" fill="none" stroke="#e8622a" stroke-width="2" rx="1"/>
    
    <!-- Bottom-left square -->
    <rect x="-18" y="6" width="12" height="12" fill="none" stroke="#e8622a" stroke-width="2" rx="1"/>
    
    <!-- Bottom-right square -->
    <rect x="6" y="6" width="12" height="12" fill="none" stroke="#e8622a" stroke-width="2" rx="1"/>
    
    <!-- Center dot -->
    <circle cx="0" cy="0" r="3" fill="#e8622a"/>
  </g>
</svg>