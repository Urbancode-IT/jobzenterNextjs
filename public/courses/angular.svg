<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="angularGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#dd0031;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#990000;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#angularGradient)" opacity="0.15"/>
  
  <!-- Angular logo (A shape) -->
  <g transform="translate(50, 50)">
    <!-- Left line of A -->
    <line x1="-15" y1="20" x2="0" y2="-15" stroke="#dd0031" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Right line of A -->
    <line x1="0" y1="-15" x2="15" y2="20" stroke="#dd0031" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Horizontal bar -->
    <line x1="-8" y1="5" x2="8" y2="5" stroke="#dd0031" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>