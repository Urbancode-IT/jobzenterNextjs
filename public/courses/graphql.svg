<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="graphqlGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e534fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#b300d4;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#graphqlGradient)" opacity="0.15"/>
  
  <!-- GraphQL logo -->
  <g transform="translate(50, 50)">
    <!-- Top triangle -->
    <path d="M 0,-20 L 15,-10 L 15,10 L 0,20 L -15,10 L -15,-10 Z" fill="none" stroke="#e534fc" stroke-width="2"/>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="6" fill="#e534fc"/>
    
    <!-- Left point -->
    <path d="M -15,-10 L -25,-5 L -20,5" fill="none" stroke="#e534fc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Right point -->
    <path d="M 15,-10 L 25,-5 L 20,5" fill="none" stroke="#e534fc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom left point -->
    <path d="M -15,10 L -10,20 L 0,25" fill="none" stroke="#e534fc" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Bottom right point -->
    <path d="M 15,10 L 10,20 L 0,25" fill="none" stroke="#e534fc" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>